<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
<title id="title">Mapa visual de O Poder de uma Crise</title>
<desc id="desc">Mapa Entre Capítulos com síntese visual do capítulo 06.</desc>
<rect width="1600" height="1800" fill="#F6F1E7"/>
<rect x="48" y="48" width="1504" height="150" rx="32" fill="#132235"/>
<text x="84" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#FFFDF8">MAPA ENTRE CAPÍTULOS  •  O PODER DO HÁBITO  •  CAPÍTULO 06</text>
<text x="84" y="136" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#FFFDF8">O Poder de uma Crise</text>
<text x="84" y="194" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506662">Rupturas podem desorganizar hábitos antigos e abrir espaço para novas decisões.</text>
<text x="84" y="246" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8" fill="#132235">NÚCLEO DO CAPÍTULO</text>
<rect x="146" y="250" width="300" height="300" rx="34" fill="#2F6854"/><text x="174" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#D7E5DD">ETAPA 01</text><text x="174" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Ruptura</text><text x="174" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">A crise interrompe rotinas e</text>
<text x="174" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">enfraquece a estabilidade do</text>
<text x="174" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">sistema.</text><path d="M456 400 H472" stroke="#132235" stroke-width="5" stroke-linecap="round"/><path d="M456 388 L472 400 L456 412" fill="none" stroke="#132235" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="482" y="250" width="300" height="300" rx="34" fill="#9E5A46"/><text x="510" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F4DED5">ETAPA 02</text><text x="510" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Abertura</text><text x="510" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Com o automático abalado,</text>
<text x="510" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">surgem brechas para rever</text>
<text x="510" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">regras e prioridades.</text><path d="M792 400 H808" stroke="#132235" stroke-width="5" stroke-linecap="round"/><path d="M792 388 L808 400 L792 412" fill="none" stroke="#132235" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="250" width="300" height="300" rx="34" fill="#D3AB53"/><text x="846" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F5E8BE">ETAPA 03</text><text x="846" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#132235">Reorganização</text><text x="846" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">Líderes e instituições podem</text>
<text x="846" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">aproveitar esse momento para</text>
<text x="846" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">reorganizar processos.</text><path d="M1128 400 H1144" stroke="#132235" stroke-width="5" stroke-linecap="round"/><path d="M1128 388 L1144 400 L1128 412" fill="none" stroke="#132235" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1154" y="250" width="300" height="300" rx="34" fill="#204335"/><text x="1182" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">ETAPA 04</text><text x="1182" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Novo padrão</text><text x="1182" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Se a nova solução se repete,</text>
<text x="1182" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">ela tende a virar o padrão</text>
<text x="1182" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">dominante.</text>
<rect x="84" y="610" width="1432" height="60" rx="30" fill="#FFF8EA" stroke="#E6DCC7" stroke-width="2"/>
<text x="800" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#204335">CRISE COMO JANELA</text>
<rect x="84" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="112" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#2F6854">IDEIAS-CHAVE</text>
<text x="112" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#132235">Guarde estas lentes</text>
<circle cx="106" cy="951" r="18" fill="#D7E5DD"/><text x="106" y="956" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#204335">1</text><text x="142" y="947" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#132235">Crises expõem hábitos que antes pareciam</text>
<text x="142" y="971.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#132235">naturais.</text><circle cx="106" cy="1046" r="18" fill="#D7E5DD"/><text x="106" y="1051" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#204335">2</text><text x="142" y="1042" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#132235">Mudanças profundas ficam mais possíveis</text>
<text x="142" y="1066.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#132235">quando o padrão quebra.</text><circle cx="106" cy="1141" r="18" fill="#D7E5DD"/><text x="106" y="1146" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#204335">3</text><text x="142" y="1137" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#132235">A janela de oportunidade não dura para</text>
<text x="142" y="1161.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#132235">sempre.</text>
<rect x="565" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="593" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#9E5A46">APLICAÇÃO PRÁTICA</text>
<text x="593" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#132235">Como revisar na prática</text>
<rect x="584" y="964" width="126" height="36" rx="18" fill="#2F6854"/><text x="647" y="987" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 01</text><text x="736" y="982" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Pergunte o que a ruptura revelou</text>
<text x="736" y="1006.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">sobre o padrão antigo.</text><rect x="584" y="1050" width="126" height="36" rx="18" fill="#9E5A46"/><text x="647" y="1073" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 02</text><text x="736" y="1068" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Defina rapidamente qual rotina</text>
<text x="736" y="1092.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">deve substituir a anterior.</text><rect x="584" y="1136" width="126" height="36" rx="18" fill="#D3AB53"/><text x="647" y="1159" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#132235">AÇÃO 03</text><text x="736" y="1154" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Transforme a exceção em processo</text>
<text x="736" y="1178.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">antes que o sistema volte ao</text>
<text x="736" y="1203.3" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">automático.</text>
<rect x="1046" y="730" width="470" height="460" rx="30" fill="#204335"/>
<text x="1074" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#D7E5DD">EXEMPLO DO CAPÍTULO</text>
<text x="1074" y="820" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">Um caso para enxergar a</text>
<text x="1074" y="862.05" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">ideia</text>
<text x="1074" y="905" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#D7E5DD">Grandes organizações costumam mudar</text>
<text x="1074" y="931.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#D7E5DD">não apenas por visão, mas porque a</text>
<text x="1074" y="957.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#D7E5DD">crise torna o custo da inércia mais</text>
<text x="1074" y="983.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#D7E5DD">visível.</text>
<text x="1074" y="1080" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#F1E7C9">PERGUNTA-CHAVE</text>
<text x="1074" y="1115" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Pergunta-chave: que mudança seria</text>
<text x="1074" y="1141.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">impossível sem esta ruptura?</text>
<line x1="84" y1="1270" x2="1516" y2="1270" stroke="#D8D0C0" stroke-width="2"/>
<text x="84" y="1312" font-family="Arial,sans-serif" font-size="13" fill="#667069">Biblioteca Entre Capítulos  •  Mapa visual de revisão  •  Conteúdo editorial complementar</text>
<text x="1516" y="1312" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#667069">clubeentrecapitulos.com.br</text>
<rect x="84" y="1360" width="1432" height="320" rx="30" fill="#F1EADC" stroke="#E0D6C6" stroke-width="2"/>
<text x="112" y="1405" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#132235">RESUMO EM UMA FRASE</text>
<text x="800" y="1502" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#132235">Pergunta-chave: que mudança seria impossível</text>
<text x="800" y="1542.96" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#132235">sem esta ruptura?</text>
</svg>