<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
<title id="title">Mapa visual de O Cérebro Ansioso</title>
<desc id="desc">Mapa Entre Capítulos com síntese visual do capítulo 02.</desc>
<rect width="1600" height="1800" fill="#F7F1E5"/>
<rect x="48" y="48" width="1504" height="150" rx="32" fill="#17201C"/>
<text x="84" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#FFFDF8">MAPA ENTRE CAPÍTULOS  •  O PODER DO HÁBITO  •  CAPÍTULO 02</text>
<text x="84" y="136" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#FFFDF8">O Cérebro Ansioso</text>
<text x="84" y="194" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506662">Como o desejo nasce antes da recompensa e passa a puxar a rotina.</text>
<text x="84" y="246" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8" fill="#17201C">NÚCLEO DO CAPÍTULO</text>
<rect x="146" y="250" width="300" height="300" rx="34" fill="#315F4B"/><text x="174" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">ETAPA 01</text><text x="174" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Deixa</text><text x="174" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Um cheiro, horário, contexto</text>
<text x="174" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">ou situação aciona a memória</text>
<text x="174" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">do padrão.</text><path d="M456 400 H472" stroke="#17201C" stroke-width="5" stroke-linecap="round"/><path d="M456 388 L472 400 L456 412" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="482" y="250" width="300" height="300" rx="34" fill="#A9583F"/><text x="510" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F1DDD5">ETAPA 02</text><text x="510" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Desejo</text><text x="510" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">A expectativa da recompensa</text>
<text x="510" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">aparece antes do resultado e</text>
<text x="510" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">aumenta a vontade.</text><path d="M792 400 H808" stroke="#17201C" stroke-width="5" stroke-linecap="round"/><path d="M792 388 L808 400 L792 412" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="250" width="300" height="300" rx="34" fill="#C7A650"/><text x="846" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F5E8BE">ETAPA 03</text><text x="846" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#17201C">Rotina</text><text x="846" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">A ação fica mais provável</text>
<text x="846" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">porque parece prometer</text>
<text x="846" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">alívio, prazer ou novidade.</text><path d="M1128 400 H1144" stroke="#17201C" stroke-width="5" stroke-linecap="round"/><path d="M1128 388 L1144 400 L1128 412" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1154" y="250" width="300" height="300" rx="34" fill="#234637"/><text x="1182" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">ETAPA 04</text><text x="1182" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Recompensa</text><text x="1182" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">O retorno confirma a</text>
<text x="1182" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">associação e fortalece o</text>
<text x="1182" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">vínculo entre sinal e</text>
<text x="1182" y="488.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">rotina.</text>
<rect x="84" y="610" width="1432" height="60" rx="30" fill="#FFF8EA" stroke="#E6DCC7" stroke-width="2"/>
<text x="800" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#234637">O CIRCUITO DO DESEJO</text>
<rect x="84" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="112" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#315F4B">IDEIAS-CHAVE</text>
<text x="112" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17201C">Guarde estas lentes</text>
<circle cx="106" cy="951" r="18" fill="#DCE8E0"/><text x="106" y="956" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">1</text><text x="142" y="947" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">A deixa pode despertar antecipação.</text><circle cx="106" cy="1046" r="18" fill="#DCE8E0"/><text x="106" y="1051" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">2</text><text x="142" y="1042" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Desejo é o elo que dá energia ao hábito.</text><circle cx="106" cy="1141" r="18" fill="#DCE8E0"/><text x="106" y="1146" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">3</text><text x="142" y="1137" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Sem uma recompensa sentida, a rotina não</text>
<text x="142" y="1161.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">ganha tração.</text>
<rect x="565" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="593" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#A9583F">APLICAÇÃO PRÁTICA</text>
<text x="593" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17201C">Como revisar na prática</text>
<rect x="584" y="964" width="126" height="36" rx="18" fill="#315F4B"/><text x="647" y="987" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 01</text><text x="736" y="982" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Observe o que você espera sentir</text>
<text x="736" y="1006.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">antes da rotina.</text><rect x="584" y="1050" width="126" height="36" rx="18" fill="#A9583F"/><text x="647" y="1073" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 02</text><text x="736" y="1068" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Diferencie vontade real de</text>
<text x="736" y="1092.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">reação automática ao contexto.</text><rect x="584" y="1136" width="126" height="36" rx="18" fill="#C7A650"/><text x="647" y="1159" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17201C">AÇÃO 03</text><text x="736" y="1154" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Redesenhe sinais e recompensas</text>
<text x="736" y="1178.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">para enfraquecer o desejo.</text>
<rect x="1046" y="730" width="470" height="460" rx="30" fill="#234637"/>
<text x="1074" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">EXEMPLOS DO CAPÍTULO</text>
<text x="1074" y="820" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">Um caso para enxergar a</text>
<text x="1074" y="862.05" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">ideia</text>
<text x="1074" y="905" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">Pepsodent e Febreze ilustram como um</text>
<text x="1074" y="931.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">hábito se fixa quando a recompensa é</text>
<text x="1074" y="957.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">esperada — e não apenas recebida.</text>
<text x="1074" y="1080" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#F1E7C9">PERGUNTA-CHAVE</text>
<text x="1074" y="1115" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Pergunta-chave: o que você passa a</text>
<text x="1074" y="1141.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">desejar quando a deixa aparece?</text>
<line x1="84" y1="1270" x2="1516" y2="1270" stroke="#D8D0C0" stroke-width="2"/>
<text x="84" y="1312" font-family="Arial,sans-serif" font-size="13" fill="#667069">Biblioteca Entre Capítulos  •  Mapa visual de revisão  •  Conteúdo editorial complementar</text>
<text x="1516" y="1312" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#667069">clubeentrecapitulos.com.br</text>
<rect x="84" y="1360" width="1432" height="320" rx="30" fill="#F1EADC" stroke="#E0D6C6" stroke-width="2"/>
<text x="112" y="1405" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#17201C">RESUMO EM UMA FRASE</text>
<text x="800" y="1502" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#17201C">Pergunta-chave: o que você passa a desejar</text>
<text x="800" y="1542.96" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#17201C">quando a deixa aparece?</text>
</svg>