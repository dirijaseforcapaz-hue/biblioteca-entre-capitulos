<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" role="img" aria-labelledby="title desc">
<title id="title">Mapa mental do Loop do Hábito</title>
<desc id="desc">Mapa visual com deixa, rotina, recompensa, diagnóstico e teste de mudança.</desc>
<rect width="1600" height="1131" fill="#F7F1E5"/>
<rect x="48" y="48" width="1504" height="118" rx="28" fill="#17201C"/>
<text x="84" y="93" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#FFFDF8">MAPA ENTRE CAPÍTULOS  •  O PODER DO HÁBITO  •  CAPÍTULO 01</text>
<text x="84" y="139" font-family="Georgia,serif" font-size="48" font-weight="700" fill="#FFFDF8">O Loop do Hábito</text>
<text x="1516" y="137" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#DCE8E0">Uma lente para observar como padrões começam, acontecem e se reforçam</text>
<text x="84" y="222" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#17201C">O CICLO EM 3 PARTES</text>
<rect x="84" y="268" width="406" height="234" rx="28" fill="#315F4B"/>
<text x="112" y="313" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" fill="#DCE8E0">01 · SINAL</text>
<text x="112" y="371" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#FFFDF8">DEIXA</text>
<text x="112" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">O que acontece antes?</text>
<text x="112" y="446" font-family="Arial,sans-serif" font-size="16" fill="#FFFDF8">Lugar, horário, emoção, pessoas, evento ou ação anterior.</text>
<rect x="575" y="268" width="406" height="234" rx="28" fill="#A9583F"/>
<text x="603" y="313" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" fill="#F1DDD5">02 · AÇÃO</text>
<text x="603" y="371" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#FFFDF8">ROTINA</text>
<text x="603" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#FFFDF8">O que eu faço exatamente?</text>
<text x="603" y="446" font-family="Arial,sans-serif" font-size="16" fill="#FFFDF8">A resposta que se repete: física, mental ou emocional.</text>
<rect x="1066" y="268" width="406" height="234" rx="28" fill="#C7A650"/>
<text x="1094" y="313" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" fill="#4B4020">03 · RETORNO</text>
<text x="1094" y="371" font-family="Georgia,serif" font-size="35" font-weight="700" fill="#17201C">RECOMPENSA</text>
<text x="1094" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17201C">O que obtenho em seguida?</text>
<text x="1094" y="446" font-family="Arial,sans-serif" font-size="16" fill="#4B4020">Alívio, distração, prazer, energia, contato social ou outro retorno percebido.</text>
<path d="M500 385.0 H559" stroke="#17201C" stroke-width="5" stroke-linecap="round"/>
<path d="M543 373.0 L559 385.0 L543 397.0" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M991 385.0 H1050" stroke="#17201C" stroke-width="5" stroke-linecap="round"/>
<path d="M1034 373.0 L1050 385.0 L1034 397.0" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1308 535 C1260 635 420 635 250 535" fill="none" stroke="#315F4B" stroke-width="4" stroke-dasharray="12 12"/>
<path d="M250 535 l18 25 l18 -25" fill="#F7F1E5" stroke="#315F4B" stroke-width="4"/>
<rect x="478" y="595" width="644" height="42" rx="21" fill="#F7F1E5"/>
<text x="800" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#234637">REPETIÇÃO + RECOMPENSA PERCEBIDA  →  O CAMINHO FICA MAIS FAMILIAR</text>
<rect x="84" y="690" width="470" height="326" rx="26" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="112" y="732" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#315F4B">DIAGNÓSTICO RÁPIDO</text>
<text x="112" y="774" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17201C">Descreva sem julgamento</text>
<circle cx="126" cy="822" r="18" fill="#DCE8E0"/>
<text x="126" y="827" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">1</text>
<text x="160" y="820" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Contexto</text>
<text x="160" y="846" font-family="Arial,sans-serif" font-size="15" fill="#667069">Onde, quando e como eu estava?</text>
<circle cx="126" cy="885" r="18" fill="#DCE8E0"/>
<text x="126" y="890" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">2</text>
<text x="160" y="883" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Comportamento</text>
<text x="160" y="909" font-family="Arial,sans-serif" font-size="15" fill="#667069">O que fiz exatamente?</text>
<circle cx="126" cy="948" r="18" fill="#DCE8E0"/>
<text x="126" y="953" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">3</text>
<text x="160" y="946" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Resultado</text>
<text x="160" y="972" font-family="Arial,sans-serif" font-size="15" fill="#667069">O que mudou logo depois?</text>
<rect x="582" y="690" width="470" height="326" rx="26" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="610" y="732" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#A9583F">COMO TESTAR MUDANÇA</text>
<text x="610" y="774" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#17201C">Mude com hipótese, não no escuro</text>
<rect x="610" y="807" width="108" height="34" rx="17" fill="#315F4B"/>
<text x="664" y="829" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">OBSERVE</text>
<text x="736" y="828" font-family="Arial,sans-serif" font-size="15" fill="#667069">registre quando o padrão aparece</text>
<rect x="610" y="869" width="108" height="34" rx="17" fill="#A9583F"/>
<text x="664" y="891" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">INVESTIGUE</text>
<text x="736" y="890" font-family="Arial,sans-serif" font-size="15" fill="#667069">descubra qual recompensa você busca</text>
<rect x="610" y="931" width="108" height="34" rx="17" fill="#C7A650"/>
<text x="664" y="953" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17201C">TESTE</text>
<text x="736" y="952" font-family="Arial,sans-serif" font-size="15" fill="#667069">experimente outra rotina com retorno semelhante</text>
<rect x="1080" y="690" width="470" height="326" rx="26" fill="#234637"/>
<text x="1108" y="732" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">IDEIA PARA GUARDAR</text>
<text x="1108" y="773" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#FFFDF8">O mapa é uma lente,</text>
<text x="1108" y="808" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#FFFDF8">não uma fórmula total.</text>
<text x="1108" y="854" font-family="Arial,sans-serif" font-size="16" fill="#DCE8E0">Sua força está em transformar um hábito difuso</text>
<text x="1108" y="881" font-family="Arial,sans-serif" font-size="16" fill="#DCE8E0">em partes observáveis. Quanto mais precisa a</text>
<text x="1108" y="908" font-family="Arial,sans-serif" font-size="16" fill="#DCE8E0">descrição do ciclo, melhores ficam as perguntas</text>
<text x="1108" y="935" font-family="Arial,sans-serif" font-size="16" fill="#DCE8E0">e os testes de mudança.</text>
<text x="1108" y="982" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#F1E7C9">PERGUNTA-CHAVE</text>
<text x="1246" y="982" font-family="Arial,sans-serif" font-size="14" fill="#FFFDF8">Qual recompensa parece sustentar este padrão?</text>
<line x1="84" y1="1054" x2="1516" y2="1054" stroke="#D8D0C0" stroke-width="2"/>
<text x="84" y="1088" font-family="Arial,sans-serif" font-size="13" fill="#667069">Biblioteca Entre Capítulos  •  Mapa visual de revisão  •  Conteúdo editorial complementar</text>
<text x="1516" y="1088" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#667069">bibliotecaentrecapitulos.com.br</text>
</svg>