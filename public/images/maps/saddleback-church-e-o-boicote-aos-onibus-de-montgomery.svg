<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
<title id="title">Mapa visual de Saddleback Church e o Boicote aos Ônibus de Montgomery</title>
<desc id="desc">Mapa Entre Capítulos com síntese visual do capítulo 08.</desc>
<rect width="1600" height="1800" fill="#F7F1E5"/>
<rect x="48" y="48" width="1504" height="150" rx="32" fill="#17201C"/>
<text x="84" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#FFFDF8">MAPA ENTRE CAPÍTULOS  •  O PODER DO HÁBITO  •  CAPÍTULO 08</text>
<text x="84" y="136" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#FFFDF8">Saddleback Church e o Boicote aos</text>
<text x="84" y="176.8" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#FFFDF8">Ônibus de Montgomery</text>
<text x="84" y="234.8" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506662">Movimentos duram quando redes sociais transformam indignação em rotina coletiva.</text>
<text x="84" y="286.8" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8" fill="#17201C">NÚCLEO DO CAPÍTULO</text>
<rect x="146" y="250" width="300" height="300" rx="34" fill="#315F4B"/><text x="174" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">ETAPA 01</text><text x="174" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Laços fortes</text><text x="174" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Amizades e vínculos próximos</text>
<text x="174" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">conseguem iniciar</text>
<text x="174" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">mobilização.</text><path d="M456 400 H472" stroke="#17201C" stroke-width="5" stroke-linecap="round"/><path d="M456 388 L472 400 L456 412" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="482" y="250" width="300" height="300" rx="34" fill="#A9583F"/><text x="510" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F1DDD5">ETAPA 02</text><text x="510" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Laços fracos</text><text x="510" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Conhecidos e conexões amplas</text>
<text x="510" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">espalham a mensagem entre</text>
<text x="510" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">grupos diferentes.</text><path d="M792 400 H808" stroke="#17201C" stroke-width="5" stroke-linecap="round"/><path d="M792 388 L808 400 L792 412" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="250" width="300" height="300" rx="34" fill="#C7A650"/><text x="846" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F5E8BE">ETAPA 03</text><text x="846" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#17201C">Pressão social</text><text x="846" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">Quando a comunidade adere,</text>
<text x="846" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">participar vira</text>
<text x="846" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">comportamento esperado.</text><path d="M1128 400 H1144" stroke="#17201C" stroke-width="5" stroke-linecap="round"/><path d="M1128 388 L1144 400 L1128 412" fill="none" stroke="#17201C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1154" y="250" width="300" height="300" rx="34" fill="#234637"/><text x="1182" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">ETAPA 04</text><text x="1182" y="344" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#FFFDF8">Rotinas</text>
<text x="1182" y="375.2" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#FFFDF8">coletivas</text><text x="1182" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Reuniões, pequenos grupos e</text>
<text x="1182" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">tarefas repetidas sustentam</text>
<text x="1182" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">o movimento no tempo.</text>
<rect x="84" y="610" width="1432" height="60" rx="30" fill="#FFF8EA" stroke="#E6DCC7" stroke-width="2"/>
<text x="800" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#234637">HÁBITOS SOCIAIS</text>
<rect x="84" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="112" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#315F4B">IDEIAS-CHAVE</text>
<text x="112" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17201C">Guarde estas lentes</text>
<circle cx="106" cy="951" r="18" fill="#DCE8E0"/><text x="106" y="956" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">1</text><text x="142" y="947" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Grandes mudanças sociais raramente surgem</text>
<text x="142" y="971.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">de indivíduos isolados.</text><circle cx="106" cy="1046" r="18" fill="#DCE8E0"/><text x="106" y="1051" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">2</text><text x="142" y="1042" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Relações próximas mobilizam; relações</text>
<text x="142" y="1066.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">amplas difundem.</text><circle cx="106" cy="1141" r="18" fill="#DCE8E0"/><text x="106" y="1146" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#234637">3</text><text x="142" y="1137" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">Movimentos persistem quando criam hábitos</text>
<text x="142" y="1161.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17201C">de participação.</text>
<rect x="565" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="593" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#A9583F">APLICAÇÃO PRÁTICA</text>
<text x="593" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#17201C">Como revisar na prática</text>
<rect x="584" y="964" width="126" height="36" rx="18" fill="#315F4B"/><text x="647" y="987" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 01</text><text x="736" y="982" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Mapeie quem inicia, quem difunde</text>
<text x="736" y="1006.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">e quem sustenta um grupo.</text><rect x="584" y="1050" width="126" height="36" rx="18" fill="#A9583F"/><text x="647" y="1073" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 02</text><text x="736" y="1068" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Procure rotinas que convertam</text>
<text x="736" y="1092.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">intenção em encontro regular.</text><rect x="584" y="1136" width="126" height="36" rx="18" fill="#C7A650"/><text x="647" y="1159" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17201C">AÇÃO 03</text><text x="736" y="1154" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Entenda que pertencimento também</text>
<text x="736" y="1178.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">é um hábito social.</text>
<rect x="1046" y="730" width="470" height="460" rx="30" fill="#234637"/>
<text x="1074" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">EXEMPLOS DO CAPÍTULO</text>
<text x="1074" y="820" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">Um caso para enxergar a</text>
<text x="1074" y="862.05" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">ideia</text>
<text x="1074" y="905" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">Montgomery e Saddleback mostram que</text>
<text x="1074" y="931.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">pertencimento, repetição e rede social</text>
<text x="1074" y="957.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">ajudam ações coletivas a ganhar</text>
<text x="1074" y="983.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DCE8E0">escala.</text>
<text x="1074" y="1080" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#F1E7C9">PERGUNTA-CHAVE</text>
<text x="1074" y="1115" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Pergunta-chave: que rotina faz uma</text>
<text x="1074" y="1141.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">causa continuar depois do entusiasmo</text>
<text x="1074" y="1167.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">inicial?</text>
<line x1="84" y1="1270" x2="1516" y2="1270" stroke="#D8D0C0" stroke-width="2"/>
<text x="84" y="1312" font-family="Arial,sans-serif" font-size="13" fill="#667069">Biblioteca Entre Capítulos  •  Mapa visual de revisão  •  Conteúdo editorial complementar</text>
<text x="1516" y="1312" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#667069">clubeentrecapitulos.com.br</text>
<rect x="84" y="1360" width="1432" height="320" rx="30" fill="#F1EADC" stroke="#E0D6C6" stroke-width="2"/>
<text x="112" y="1405" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#17201C">RESUMO EM UMA FRASE</text>
<text x="800" y="1502" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#17201C">Pergunta-chave: que rotina faz uma causa</text>
<text x="800" y="1542.96" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#17201C">continuar depois do entusiasmo inicial?</text>
</svg>