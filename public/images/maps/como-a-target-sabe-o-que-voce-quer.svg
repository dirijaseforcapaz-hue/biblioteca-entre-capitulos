<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
<title id="title">Mapa visual de Como a Target Sabe o que Você Quer</title>
<desc id="desc">Mapa Entre Capítulos com síntese visual do capítulo 07.</desc>
<rect width="1600" height="1800" fill="#F8F3E8"/>
<rect x="48" y="48" width="1504" height="150" rx="32" fill="#1A2433"/>
<text x="84" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#FFFDF8">MAPA ENTRE CAPÍTULOS  •  O PODER DO HÁBITO  •  CAPÍTULO 07</text>
<text x="84" y="136" font-family="Georgia,serif" font-size="50" font-weight="700" fill="#FFFDF8">Como a Target Sabe o que Você Quer</text>
<text x="84" y="194" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#506662">Empresas conseguem inferir necessidades ao rastrear padrões repetidos de consumo.</text>
<text x="84" y="246" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8" fill="#1A2433">NÚCLEO DO CAPÍTULO</text>
<rect x="146" y="250" width="300" height="300" rx="34" fill="#446D58"/><text x="174" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DBE6DF">ETAPA 01</text><text x="174" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Dados</text><text x="174" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Cada compra, horário e</text>
<text x="174" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">recorrência deixa um rastro</text>
<text x="174" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">observável.</text><path d="M456 400 H472" stroke="#1A2433" stroke-width="5" stroke-linecap="round"/><path d="M456 388 L472 400 L456 412" fill="none" stroke="#1A2433" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="482" y="250" width="300" height="300" rx="34" fill="#B1634E"/><text x="510" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F4E0D8">ETAPA 02</text><text x="510" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Padrões</text><text x="510" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Quando muitos dados se</text>
<text x="510" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">repetem, surgem padrões com</text>
<text x="510" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">valor preditivo.</text><path d="M792 400 H808" stroke="#1A2433" stroke-width="5" stroke-linecap="round"/><path d="M792 388 L808 400 L792 412" fill="none" stroke="#1A2433" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="250" width="300" height="300" rx="34" fill="#C7A258"/><text x="846" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#F5E8BE">ETAPA 03</text><text x="846" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#1A2433">Previsão</text><text x="846" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">A empresa passa a estimar</text>
<text x="846" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">momentos, preferências e</text>
<text x="846" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#4B4020">próximas necessidades.</text><path d="M1128 400 H1144" stroke="#1A2433" stroke-width="5" stroke-linecap="round"/><path d="M1128 388 L1144 400 L1128 412" fill="none" stroke="#1A2433" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1154" y="250" width="300" height="300" rx="34" fill="#284536"/><text x="1182" y="294" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DCE8E0">ETAPA 04</text><text x="1182" y="344" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#FFFDF8">Influência</text><text x="1182" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Com isso, consegue ajustar</text>
<text x="1182" y="436.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">ofertas, comunicações e</text>
<text x="1182" y="462.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">contexto de decisão.</text>
<rect x="84" y="610" width="1432" height="60" rx="30" fill="#FFF8EA" stroke="#E6DCC7" stroke-width="2"/>
<text x="800" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#284536">HÁBITOS E PREVISÃO</text>
<rect x="84" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="112" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#446D58">IDEIAS-CHAVE</text>
<text x="112" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#1A2433">Guarde estas lentes</text>
<circle cx="106" cy="951" r="18" fill="#DBE6DF"/><text x="106" y="956" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#284536">1</text><text x="142" y="947" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1A2433">Hábitos não interessam apenas ao</text>
<text x="142" y="971.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1A2433">indivíduo, mas também ao mercado.</text><circle cx="106" cy="1046" r="18" fill="#DBE6DF"/><text x="106" y="1051" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#284536">2</text><text x="142" y="1042" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1A2433">Previsão depende menos de adivinhar</text>
<text x="142" y="1066.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1A2433">desejos e mais de ler padrões.</text><circle cx="106" cy="1141" r="18" fill="#DBE6DF"/><text x="106" y="1146" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#284536">3</text><text x="142" y="1137" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1A2433">A utilidade comercial dos hábitos levanta</text>
<text x="142" y="1161.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#1A2433">questões éticas de privacidade.</text>
<rect x="565" y="730" width="470" height="460" rx="30" fill="#FFFDF8" stroke="#D8D0C0" stroke-width="2"/>
<text x="593" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#B1634E">APLICAÇÃO PRÁTICA</text>
<text x="593" y="820" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#1A2433">Como revisar na prática</text>
<rect x="584" y="964" width="126" height="36" rx="18" fill="#446D58"/><text x="647" y="987" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 01</text><text x="736" y="982" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Perceba quais rastros você deixa</text>
<text x="736" y="1006.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">ao repetir comportamentos de</text>
<text x="736" y="1031.3" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">compra.</text><rect x="584" y="1050" width="126" height="36" rx="18" fill="#B1634E"/><text x="647" y="1073" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">AÇÃO 02</text><text x="736" y="1068" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Observe como ofertas parecem</text>
<text x="736" y="1092.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">chegar no momento “certo”.</text><rect x="584" y="1136" width="126" height="36" rx="18" fill="#C7A258"/><text x="647" y="1159" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#1A2433">AÇÃO 03</text><text x="736" y="1154" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">Reflita sobre conveniência</text>
<text x="736" y="1178.65" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#667069">versus privacidade.</text>
<rect x="1046" y="730" width="470" height="460" rx="30" fill="#284536"/>
<text x="1074" y="775" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#DBE6DF">EXEMPLO DO CAPÍTULO</text>
<text x="1074" y="820" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">Um caso para enxergar a</text>
<text x="1074" y="862.05" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#FFFDF8">ideia</text>
<text x="1074" y="905" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DBE6DF">A narrativa da Target mostra como</text>
<text x="1074" y="931.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DBE6DF">hábitos de compra viram sinais úteis</text>
<text x="1074" y="957.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DBE6DF">para segmentação, recomendação e</text>
<text x="1074" y="983.3" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#DBE6DF">timing de campanhas.</text>
<text x="1074" y="1080" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#F1E7C9">PERGUNTA-CHAVE</text>
<text x="1074" y="1115" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">Pergunta-chave: quais padrões seus</text>
<text x="1074" y="1141.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#FFFDF8">dados permitem prever sobre você?</text>
<line x1="84" y1="1270" x2="1516" y2="1270" stroke="#D8D0C0" stroke-width="2"/>
<text x="84" y="1312" font-family="Arial,sans-serif" font-size="13" fill="#667069">Biblioteca Entre Capítulos  •  Mapa visual de revisão  •  Conteúdo editorial complementar</text>
<text x="1516" y="1312" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#667069">clubeentrecapitulos.com.br</text>
<rect x="84" y="1360" width="1432" height="320" rx="30" fill="#F1EADC" stroke="#E0D6C6" stroke-width="2"/>
<text x="112" y="1405" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#1A2433">RESUMO EM UMA FRASE</text>
<text x="800" y="1502" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1A2433">Pergunta-chave: quais padrões seus dados</text>
<text x="800" y="1542.96" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1A2433">permitem prever sobre você?</text>
</svg>